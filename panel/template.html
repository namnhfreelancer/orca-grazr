<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Accounts</title>
    <style>
      /* Orca injects its design tokens as --orca-<name> (1.4.245+) or as bare <name> (older hosts); each use names the
         --orca- token first, then the bare one, then the fallback, so the page reads either host and stays readable without both. */
      :root {
        --grazr-ok: #4ade80;
        --grazr-next: #f97316;
        --grazr-warn: #fbbf24;
        --grazr-acct-1: #8b5cf6;
        --grazr-acct-2: #14b8a6;
        --grazr-acct-3: #ec4899;
        --grazr-acct-4: #818cf8;
        --grazr-acct-5: #c9964a;
      }
      /* The dark values above are light on a dark card; on a light card they fall to about 1.7:1, so light mode gets darker ones (text at least 4.5:1 on white). */
      html.light {
        --grazr-ok: #15803d;
        --grazr-next: #c2410c;
        --grazr-warn: #b45309;
        --grazr-acct-1: #6d28d9;
        --grazr-acct-2: #0f766e;
        --grazr-acct-3: #be185d;
        --grazr-acct-4: #4338ca;
        --grazr-acct-5: #8a5a1c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 12px;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--orca-foreground, var(--foreground, CanvasText));
        background: var(--orca-card, var(--card, var(--orca-background, var(--background, transparent))));
        overflow-x: hidden;
      }
      main { display: flex; flex-direction: column; gap: 10px; }
      .host {
        border: 1px solid var(--orca-border, var(--border, transparent));
        border-radius: 8px;
        padding: 12px;
        min-width: 0;
      }
      [hidden] { display: none !important; }
      /* The tab strip: one tab per host. The selected tab is filled, bold and underlined; a strip wider than the sidebar scrolls sideways. */
      .host-tabs {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        margin: 0 0 8px;
        padding: 2px 2px 4px;
        border-bottom: 1px solid var(--orca-border, var(--border, transparent));
        scrollbar-width: thin;
      }
      .host-tab {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        padding: 4px 9px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--orca-muted-foreground, var(--muted-foreground, #999));
        font: inherit;
        font-size: 12px;
        white-space: nowrap;
        cursor: pointer;
      }
      .host-tab:hover {
        border-color: var(--orca-border, var(--border, transparent));
        color: var(--orca-foreground, var(--foreground, CanvasText));
      }
      .host-tab[aria-selected="true"] {
        color: var(--orca-foreground, var(--foreground, CanvasText));
        background: var(--orca-secondary, var(--secondary, transparent));
        border-color: var(--orca-border, var(--border, transparent));
        font-weight: 600;
        box-shadow: inset 0 -2px 0 var(--orca-primary, var(--primary, currentColor));
      }
      .host-tab:focus-visible { outline: 2px solid var(--orca-ring, var(--ring, currentColor)); outline-offset: 1px; }
      .host-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--orca-muted-foreground, var(--muted-foreground, #999)); }
      .host-dot.dot-on { background: var(--grazr-ok); }
      .host-dot.dot-down { background: var(--orca-destructive, var(--destructive, #f87171)); }
      .host-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
      .thresholds { margin: 2px 0 0; width: 100%; font-size: 11px; color: var(--orca-muted-foreground, var(--muted-foreground, #999)); }
      .engine { margin: 0; width: 100%; font-size: 11px; color: var(--orca-muted-foreground, var(--muted-foreground, #999)); }
      .chip {
        display: inline-block;
        padding: 0 7px;
        border: 1px solid var(--orca-border, var(--border, transparent));
        border-radius: 999px;
        font-size: 11px;
        line-height: 18px;
        color: var(--orca-muted-foreground, var(--muted-foreground, #999));
      }
      .chip-on { color: var(--grazr-ok); border-color: var(--grazr-ok); }
      .chip-unreachable,
      .chip-not-installed { color: var(--orca-destructive, var(--destructive, #f87171)); border-color: var(--orca-destructive, var(--destructive, #f87171)); }
      .chip-foreign { color: var(--grazr-next); border-color: var(--grazr-next); }
      .chip-outdated { color: var(--grazr-next); border-color: var(--grazr-next); }
      .chip-managed { color: var(--grazr-warn); border-color: var(--grazr-warn); }
      .chip-not-connected { color: var(--orca-muted-foreground, var(--muted-foreground, #999)); border-color: var(--orca-muted-foreground, var(--muted-foreground, #999)); }
      .views { display: flex; gap: 6px; margin: 10px 0 4px; }
      .views .spacer { flex: 1; }
      button {
        padding: 4px 9px;
        border: 1px solid var(--orca-border, var(--border, transparent));
        border-radius: 6px;
        background: var(--orca-secondary, var(--secondary, transparent));
        color: var(--orca-foreground, var(--foreground, CanvasText));
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover { border-color: var(--orca-primary, var(--primary, currentColor)); }
      button[aria-pressed="true"] {
        background: var(--orca-primary, var(--primary, currentColor));
        border-color: var(--orca-primary, var(--primary, currentColor));
        color: var(--orca-primary-foreground, var(--primary-foreground, Canvas));
      }
      svg { display: block; width: 100%; max-width: 240px; height: auto; margin: 6px auto; }
      .seg-active{stroke:var(--grazr-ok);stroke-opacity:.28}
      .seg-ok{stroke:var(--grazr-ok);stroke-opacity:.4}
      .seg-next{stroke:var(--grazr-next)}
      .seg-spent{stroke:var(--orca-destructive, var(--destructive,#f87171));stroke-opacity:.6}
      .seg-blocked{stroke:var(--orca-destructive, var(--destructive,#f87171))}
      .seg-unknown{stroke:var(--orca-muted-foreground, var(--muted-foreground,#999));stroke-opacity:.2}
      .fill { stroke: var(--grazr-ok); }
      .fill-fine { stroke: var(--grazr-ok); }
      .fill-warning { stroke: var(--grazr-warn); }
      .fill-spent,
      .fill-blocked { stroke: var(--orca-destructive, var(--destructive, #f87171)); }
      .needle { stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
      .needle-dot { fill: currentColor; }
      .threshold-tick { stroke: var(--orca-muted-foreground, var(--muted-foreground, #999)); stroke-width: 1.5; stroke-linecap: round; }
      .badge { fill: var(--orca-muted-foreground, var(--muted-foreground, #999)); font-size: 11px; }
      .centre-name { fill: currentColor; font-weight: 600; }
      .centre-pct { font-weight: 600; }
      .tone-fine{fill:var(--grazr-ok)}
      .tone-warning{fill:var(--grazr-warn)}
      .tone-spent,.tone-blocked{fill:var(--orca-destructive, var(--destructive,#f87171))}
      .tone-none{fill:currentColor}
      .centre-hint { fill: var(--orca-muted-foreground, var(--muted-foreground, #999)); }
      .centre-next,.centre-next-name{fill:var(--grazr-next)}
      .centre-next.none,.centre-next-name.none{fill:var(--orca-muted-foreground, var(--muted-foreground,#999))}
      /* The model rings sit after the tone fills above, so their fill:none wins over the tone colour. */
      .mseg-track { stroke: var(--orca-muted-foreground, var(--muted-foreground, #999)); stroke-opacity: .2; fill: none; }
      .mseg-fill { fill: none; stroke-opacity: .85; }
      .mseg-fill.dim { stroke-opacity: .3; }
      .mseg-fill.tone-fine { stroke: var(--grazr-ok); }
      .mseg-fill.tone-warning { stroke: var(--grazr-warn); }
      .mseg-fill.tone-spent,
      .mseg-fill.tone-blocked { stroke: var(--orca-destructive, var(--destructive, #f87171)); }
      .mtick { stroke: var(--orca-muted-foreground, var(--muted-foreground, #999)); stroke-width: 1; stroke-linecap: round; }
      .mseg-fill, .mtick { pointer-events: none; }
      .dial-note { font-size: 10.5px; color: var(--orca-muted-foreground, var(--muted-foreground, #999)); text-align: center; margin: 2px 0 0; }
      .host:not([data-face="dial"]) .dial-note { display: none }
      .clock-face { stroke: var(--orca-muted-foreground, var(--muted-foreground, #999)); stroke-opacity: .22; fill: none; }
      .clock-tick { stroke: var(--orca-muted-foreground, var(--muted-foreground, #999)); stroke-opacity: .6; }
      .clock-label { fill: var(--orca-muted-foreground, var(--muted-foreground, #999)); }
      .stretch { fill: none; stroke-linecap: butt; }
      .stretch.acct-1 { stroke: var(--grazr-acct-1); }
      .stretch.acct-2 { stroke: var(--grazr-acct-2); }
      .stretch.acct-3 { stroke: var(--grazr-acct-3); }
      .stretch.acct-4 { stroke: var(--grazr-acct-4); }
      .stretch.acct-5 { stroke: var(--grazr-acct-5); }
      .stretch-gap { stroke: var(--orca-destructive, var(--destructive, #f87171)); }
      .clock-swap { stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
      .clock-refill.acct-1 { fill: var(--grazr-acct-1); }
      .clock-refill.acct-2 { fill: var(--grazr-acct-2); }
      .clock-refill.acct-3 { fill: var(--grazr-acct-3); }
      .clock-refill.acct-4 { fill: var(--grazr-acct-4); }
      .clock-refill.acct-5 { fill: var(--grazr-acct-5); }
      .clock-refill-num { fill: white; font-weight: 700; }
      .clock-hand { stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
      .clock-time { fill: currentColor; font-weight: 600; }
      .clock-day, .clock-runs, .clock-then { fill: var(--orca-muted-foreground, var(--muted-foreground, #999)); }
      .clock-then.gap, .clock-gap { fill: var(--orca-destructive, var(--destructive, #f87171)); }
      .clock-name { font-weight: 600; }
      .clock-name.acct-1 { fill: var(--grazr-acct-1); }
      .clock-name.acct-2 { fill: var(--grazr-acct-2); }
      .clock-name.acct-3 { fill: var(--grazr-acct-3); }
      .clock-name.acct-4 { fill: var(--grazr-acct-4); }
      .clock-name.acct-5 { fill: var(--grazr-acct-5); }
      .clock-note { margin: 0; font-size: 10.5px; text-align: center; color: var(--orca-muted-foreground, var(--muted-foreground, #999)); }
      .tip {
        position: fixed;
        z-index: 10;
        max-width: 220px;
        padding: 8px 10px;
        border: 1px solid var(--orca-border, var(--border, transparent));
        border-radius: 8px;
        background: var(--orca-popover, var(--popover, #171717));
        color: var(--orca-popover-foreground, var(--popover-foreground, inherit));
        font-size: 12px;
        line-height: 1.4;
        pointer-events: none;
      }
      .tip > div + div { margin-top: 2px; }
      .tip .muted { color: var(--orca-muted-foreground, var(--muted-foreground, #999)); }
      .tip .tone-fine { color: var(--grazr-ok); }
      .tip .tone-warning { color: var(--grazr-warn); }
      .tip .tone-spent,
      .tip .tone-blocked { color: var(--orca-destructive, var(--destructive, #f87171)); }
      .host[data-face="dial"] .clock, .host[data-face="dial"] .clock-note, .host[data-face="clock"] .dial { display: none }
      .host[data-face="list"] .dial, .host[data-face="list"] .clock, .host[data-face="list"] .clock-note, .host[data-face="list"] .rows, .host[data-face="list"] button.view { display: none }
      .host:not([data-face="list"]) .list { display: none }
      .list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
      .acct {
        min-width: 0;
        padding: 8px 10px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: rgba(128,128,128,.12);
      }
      .acct-active { border-color: var(--grazr-ok); }
      .acct-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
      .acct-head .spacer { flex: 1 1 0; }
      .acct-head .act { font-size: 11px; padding: 2px 7px; }
      .acct-name { min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
      .acct-active .acct-name { color: var(--grazr-ok); }
      .chip-blocked { color: var(--orca-destructive, var(--destructive, #f87171)); border-color: var(--orca-destructive, var(--destructive, #f87171)); }
      .chip-muted { color: var(--orca-muted-foreground, var(--muted-foreground, #999)); }
      .acct-org { margin: 2px 0 0; font-size: 11px; color: var(--orca-muted-foreground, var(--muted-foreground, #999)); overflow-wrap: anywhere; }
      .win {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 8px;
        margin-top: 6px;
        font-size: 12px;
      }
      .win-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar { grid-column: 1 / -1; margin-top: 3px; height: 6px; border-radius: 3px; overflow: hidden; background: rgba(128,128,128,.28); }
      .bar-fill { height: 100%; border-radius: 3px; background: var(--grazr-ok); }
      .bar-fill.tone-warning { background: var(--grazr-warn); }
      .bar-fill.tone-spent { background: var(--orca-destructive, var(--destructive, #f87171)); }
      .win-left { text-align: right; font-variant-numeric: tabular-nums; }
      .win-left.tone-fine { color: var(--grazr-ok); }
      .win-left.tone-warning { color: var(--grazr-warn); }
      .win-left.tone-spent { color: var(--orca-destructive, var(--destructive, #f87171)); }
      .win-reset { text-align: right; color: var(--orca-muted-foreground, var(--muted-foreground, #999)); font-size: 11px; white-space: nowrap; }
      .reading { margin: 6px 0 0; font-size: 11px; color: var(--orca-muted-foreground, var(--muted-foreground, #999)); }
      .host[data-face="clock"] .row-index.acct-1 { color: var(--grazr-acct-1); }
      .host[data-face="clock"] .row-index.acct-2 { color: var(--grazr-acct-2); }
      .host[data-face="clock"] .row-index.acct-3 { color: var(--grazr-acct-3); }
      .host[data-face="clock"] .row-index.acct-4 { color: var(--grazr-acct-4); }
      .host[data-face="clock"] .row-index.acct-5 { color: var(--grazr-acct-5); }
      .host[data-view="session"] .view-weekly,
      .host[data-view="weekly"] .view-session { display: none; }
      .rows { list-style: none; margin: 6px 0 0; padding: 0; }
      .row {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr) auto auto;
        align-items: center;
        column-gap: 8px;
        padding: 4px 0;
        border-top: 1px solid var(--orca-border, var(--border, transparent));
      }
      .row-index { color: var(--orca-muted-foreground, var(--muted-foreground, #999)); font-variant-numeric: tabular-nums; }
      .row-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row-name::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 6px;
        border-radius: 50%;
        vertical-align: middle;
        background: var(--orca-muted-foreground, var(--muted-foreground, #999));
      }
      .row-spent .row-name::before,
      .row-unread .row-name::before,
      .row-no-limit .row-name::before,
      .row-not-enrolled .row-name::before { opacity: 0.2; }
      .row-active .row-name{color:var(--grazr-ok)}
      .row-active .row-name::before{background:var(--grazr-ok)}
      .row-next .row-name::before{background:var(--grazr-next)}
      .row-blocked .row-name::before{background:var(--orca-destructive, var(--destructive,#f87171))}
      .row-ok .row-name::before { background: var(--grazr-ok); opacity: 0.4; }
      .row-pct { font-variant-numeric: tabular-nums; }
      .row-label {
        font-size: 11px;
        color: var(--orca-muted-foreground, var(--muted-foreground, #999));
        text-align: right;
      }
      .row-next .row-label { color: var(--grazr-next); }
      .row-blocked .row-label { color: var(--orca-destructive, var(--destructive, #f87171)); }
      .row-active .row-label { color: var(--grazr-ok); }
      .row > .row-acts {
        grid-column: 2 / -1;
        display: flex;
        gap: 6px;
        margin: 2px 0 2px;
      }
      .row-acts > .act { font-size: 11px; }
      .row > .act {
        grid-column: 2 / -1;
        justify-self: start;
        margin: 2px 0 2px;
        font-size: 11px;
      }
      .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
      @media (min-width: 540px) { .actions { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
      .actions > .act:only-child { justify-self: start; }
      .actions > .act {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 4px 6px;
      }
      .act { font-size: 12px; }
      .act:disabled { opacity: 0.5; cursor: default; }
      .msg-error { color: var(--orca-destructive, var(--destructive, #f87171)); }
      .msg {
        min-height: 1.2em;
        margin: 6px 0 0;
        font-size: 12px;
        color: var(--orca-muted-foreground, var(--muted-foreground, #999));
        overflow-wrap: anywhere;
      }
      .cmd { margin: 6px 0 0; padding: 6px; font-size: 11px; font-family: ui-monospace, Menlo, monospace;
             white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all;
             border: 1px solid var(--orca-border, var(--border, transparent)); border-radius: 4px; cursor: text; }
      .failure { margin: 8px 0 0; color: var(--orca-destructive, var(--destructive, #f87171)); overflow-wrap: anywhere; }
      .placeholder p { margin: 0 0 6px; color: var(--orca-muted-foreground, var(--muted-foreground, #999)); }
      footer {
        margin-top: 12px;
        font-size: 11px;
        color: var(--orca-muted-foreground, var(--muted-foreground, #999));
      }
    </style>
  </head>
  <body>
    <main><!--__CARDS__--></main>
    <footer id="stamp"></footer>
    <div class="tip" hidden></div>
    <script>
      'use strict'
      var data = /*__DATA__*/;

      // The panel frame is an opaque origin, so '*' is the only usable targetOrigin; the host verifies the sender.
      var seq = 0
      var pending = {}

      // Every call resolves to { ok: true, value } (value is the host's result) or { ok: false, errorCode, error }.
      // Orca 1.4.245+ gives the frame window.orca.host.call, which resolves with the result and rejects with an
      // error that carries code and message; an older host takes the postMessage bridge below.
      // Calls wait 5 s, except a command, which may run for up to 30 s. A call the page gave up on resolves
      // with timedOut set: the host may still be running it, so the page must not guide the user to run it again.
      function call(action, params, timeoutMs) {
        return new Promise(function (resolve) {
          var settled = false
          var requestId = null
          var timer = setTimeout(function () {
            if (settled) return
            settled = true
            if (requestId) delete pending[requestId]
            resolve({ ok: false, error: 'timeout', timedOut: true })
          }, timeoutMs || 5000)
          function finish(result) {
            if (settled) return
            settled = true
            clearTimeout(timer)
            resolve(result)
          }
          if (window.orca && window.orca.host && typeof window.orca.host.call === 'function') {
            try {
              window.orca.host.call(action, params).then(function (value) {
                finish({ ok: true, value: value })
              }, function (error) {
                finish({ ok: false, errorCode: error && error.code, error: error && error.message })
              })
            } catch (error) {
              finish({ ok: false, error: String(error && error.message || error) })
            }
            return
          }
          requestId = 'req-' + ++seq
          pending[requestId] = finish
          window.parent.postMessage({ type: 'orca-panel-action', requestId: requestId, action: action, params: params }, '*')
        })
      }

      window.addEventListener('message', function (event) {
        if (event.source !== window.parent) return
        var msg = event.data
        if (!msg || msg.type !== 'orca-panel-action-result') return
        var resolve = pending[msg.requestId]
        if (!resolve) return
        delete pending[msg.requestId]
        resolve(msg)
      })

      function cardOf(element) {
        return element.closest('.host')
      }

      function setMsg(element, text, isError) {
        var card = cardOf(element)
        var line = card && card.querySelector('p.msg')
        if (!line) return
        line.textContent = text
        line.classList.toggle('msg-error', !!isError)
      }

      function setView(card, view) {
        card.setAttribute('data-view', view)
        card.querySelectorAll('button.view').forEach(function (toggle) {
          toggle.setAttribute('aria-pressed', toggle.getAttribute('data-view') === view ? 'true' : 'false')
        })
      }

      function setFace(card, face) {
        card.setAttribute('data-face', face)
        card.querySelectorAll('button.face').forEach(function (toggle) {
          toggle.setAttribute('aria-pressed', toggle.getAttribute('data-face') === face ? 'true' : 'false')
        })
      }

      // While one button's call is pending, every button in its card is disabled, so a second click cannot repeat it.
      function setBusy(card, busy) {
        card.setAttribute('data-busy', busy ? 'true' : 'false')
        card.querySelectorAll('button.act').forEach(function (other) {
          other.disabled = busy
        })
      }

      // The host's errors that mean it runs the worker's commands neither way here: the page then names the Cmd-J command instead.
      var FALLBACK_CODES = ['invalid_request', 'unknown_method', 'panel_forbidden', 'capability_denied', 'consent_required']
      var COMMAND_TIMEOUT_MS = 30000
      // A page older than this was written by a worker that has not run since (Orca restarted): one panel refresh wakes it.
      var STALE_MS = 180000
      // A click or focus on the command selects all of it, so one copy gets the whole line.
      function selectCommand(event) {
        var sel = window.getSelection()
        if (sel) sel.selectAllChildren(event.currentTarget)
      }

      // A host with neither plugin.request nor commands.execute cannot run a button: it names its Cmd-J command on the card instead.
      // A swap to one named account has no palette form; its command text is shown too, selectable, to copy into a terminal.
      function guideFor(button) {
        var title = button.getAttribute('data-palette') || ''
        var params = paramsOf(button)
        if (button.classList.contains('act-swap-to') && typeof params.account === 'string') {
          var text = button.getAttribute('data-text') || ''
          return {
            message: 'Run Cmd-J › ' + title + ' (swaps to the next account; to pick ' + params.account + ', run the command from a terminal: ' + text + ')',
            command: text
          }
        }
        return { message: 'Run Cmd-J › ' + title, command: '' }
      }

      // Shows the command under the card's message, reusing the card's own pre when it exists.
      function showCommand(card, text) {
        var line = card.querySelector('p.msg')
        if (!line) return
        var pre = card.querySelector('pre.cmd')
        if (!pre) {
          pre = document.createElement('pre')
          pre.className = 'cmd'
          pre.tabIndex = 0
          pre.addEventListener('click', selectCommand)
          pre.addEventListener('focus', selectCommand)
          line.insertAdjacentElement('afterend', pre)
        }
        pre.textContent = text
      }

      function clearCommand(card) {
        card.querySelectorAll('pre.cmd').forEach(function (el) { el.remove() })
      }

      // Each card opens on the face and window its data-view and data-face carry (the settings' choice).
      // A click sets the choice on every card at once; nothing is stored, so it holds until the page is next rewritten.
      document.querySelectorAll('section.host').forEach(function (card) {
        setView(card, card.getAttribute('data-view'))
        setFace(card, card.getAttribute('data-face'))
      })
      // The dial's tooltip: one delegated listener per event, so the cards drawn later need no binding.
      // Every line is made with createElement and textContent; nothing from the data is parsed as HTML.
      var tip = document.querySelector('.tip')
      var TIP_SEG = '[data-tip-label]'
      var TIP_TONES = ['fine', 'warning', 'spent', 'blocked', 'none']
      function tipLine(parent, text, className) {
        if (!text) return
        var line = document.createElement('div')
        if (className) line.className = className
        line.textContent = text
        parent.appendChild(line)
      }
      function tipFill(seg) {
        var get = function (key) { return seg.getAttribute('data-tip-' + key) || '' }
        var tone = TIP_TONES.indexOf(get('tone')) >= 0 ? get('tone') : 'none'
        tip.textContent = ''
        var head = document.createElement('div')
        var label = document.createElement('b')
        label.textContent = get('label')
        var left = document.createElement('span')
        left.className = 'tone-' + tone
        left.textContent = get('left')
        head.appendChild(label)
        head.appendChild(document.createTextNode(' '))
        head.appendChild(left)
        tip.appendChild(head)
        tipLine(tip, get('name'), '')
        tipLine(tip, get('tick'), get('tick-tone') === 'warning' ? 'tone-warning' : 'muted')
        tipLine(tip, get('resets'), 'muted')
      }
      function tipPlace(e) {
        tip.style.left = Math.max(8, Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8)) + 'px'
        tip.style.top = Math.max(8, Math.min(e.clientY + 12, innerHeight - tip.offsetHeight - 8)) + 'px'
      }
      document.addEventListener('mouseover', function (e) {
        try {
          var seg = e.target.closest ? e.target.closest(TIP_SEG) : null
          if (!seg) return
          tipFill(seg)
          tip.hidden = false
          tipPlace(e)
        } catch (err) {}
      })
      document.addEventListener('mousemove', function (e) {
        try { if (!tip.hidden) tipPlace(e) } catch (err) {}
      })
      document.addEventListener('mouseout', function (e) {
        try { if (e.target.closest && e.target.closest(TIP_SEG)) tip.hidden = true } catch (err) {}
      })

      // The controls are bound per element, at load and again under a <main> the live update replaced (bindControls).
      function bindToggles(root) {
        root.querySelectorAll('button.view').forEach(function (toggle) {
          toggle.addEventListener('click', function () {
            var view = toggle.getAttribute('data-view')
            document.querySelectorAll('section.host').forEach(function (card) { setView(card, view) })
          })
        })
        root.querySelectorAll('button.face').forEach(function (toggle) {
          toggle.addEventListener('click', function () {
            var face = toggle.getAttribute('data-face')
            document.querySelectorAll('section.host').forEach(function (card) { setFace(card, face) })
          })
        })
      }
      bindToggles(document)
      // The params are the JSON the button carries; a value that does not parse sends none.
      function paramsOf(button) {
        try {
          return JSON.parse(button.getAttribute('data-params') || '{}')
        } catch (e) {
          return {}
        }
      }

      // Codes that mean the host has no plugin.request handler of that name: the older commands.execute route is tried then.
      var REQUEST_MISSING = ['invalid_request', 'unknown_method']
      // Whether this frame's host offers plugin.request (Orca 1.4.246+): host.has says; an older bridge has no has.
      function hostHasRequest() {
        var host = window.orca && window.orca.host
        return !!(host && typeof host.has === 'function' && host.has('plugin.request'))
      }

      // Runs one of the worker's commands: through plugin.request where the host offers it (the plugin's own worker, no
      // capability), else through commands.execute. Either way the result reads as commands.execute reports it:
      // { ok: true, value: { value: <the command's return> } }, or { ok: false, errorCode, error, timedOut }.
      function runWorker(commandId, params) {
        var execute = function () {
          return call('commands.execute', { commandId: commandId, params: params }, COMMAND_TIMEOUT_MS)
        }
        if (!hostHasRequest()) return execute()
        return call('plugin.request', { name: commandId, input: params, timeoutMs: COMMAND_TIMEOUT_MS }, COMMAND_TIMEOUT_MS).then(function (result) {
          if (result.ok) return { ok: true, value: { value: result.value && result.value.output } }
          if (!result.timedOut && REQUEST_MISSING.indexOf(result.errorCode) >= 0) return execute()
          return result
        })
      }

      // Runs the button's command in the worker. The worker's message shows on the card's line; a host that runs it
      // neither way (official Orca before 1.4.246) gets the Cmd-J guide instead; a timeout is reported, since it may still run.
      function runCommand(button) {
        var card = cardOf(button)
        if (!card || card.getAttribute('data-busy') === 'true') return
        var commandId = button.getAttribute('data-command')
        setBusy(card, true)
        setMsg(button, 'Working…')
        runWorker(commandId, paramsOf(button)).then(function (result) {
          if (result.ok) {
            // The result wraps the command's return value once more: { value: { ok, message } }.
            var value = (result.value && result.value.value) || {}
            var message = typeof value.message === 'string' && value.message !== '' ? value.message : commandId + (value.ok === false ? ' failed' : ' done')
            setMsg(button, message, value.ok === false)
            setBusy(card, false)
            return
          }
          if (result.timedOut) {
            setMsg(button, commandId + ' timed out', true)
            setBusy(card, false)
            return
          }
          if (FALLBACK_CODES.indexOf(result.errorCode) >= 0) {
            var guide = guideFor(button)
            clearCommand(card)
            if (guide.command) showCommand(card, guide.command)
            setMsg(button, guide.message)
            setBusy(card, false)
            return
          }
          setMsg(button, commandId + ' failed: ' + (result.error || result.errorCode), true)
          setBusy(card, false)
        })
      }

      function bindCommands(root) {
        root.querySelectorAll('button.act[data-command]').forEach(function (button) {
          button.addEventListener('click', function () {
            runCommand(button)
          })
        })
      }
      bindCommands(document)

      // The list face's reading age: "Reading from …" under each account, at load and every 30 s.
      // Under a minute it reads "just now"; otherwise the largest whole day, hour or minute that fits.
      function ageText(seconds, now) {
        if (!Number.isFinite(seconds)) return ''
        var age = now - seconds
        if (!(age >= 60)) return 'just now'
        var units = [['day', 86400], ['hour', 3600], ['minute', 60]]
        var formatter = new Intl.RelativeTimeFormat('en', { numeric: 'always', style: 'short' })
        for (var i = 0; i < units.length; i++) {
          if (age >= units[i][1]) return formatter.format(-Math.floor(age / units[i][1]), units[i][0])
        }
        return 'just now'
      }

      function ageLines() {
        var now = Date.now() / 1000
        document.querySelectorAll('p.reading[data-updated]').forEach(function (line) {
          // One reading's failure must not stop the others.
          try {
            var raw = line.getAttribute('data-updated')
            var seconds = raw !== null && raw.trim() !== '' ? Number(raw) : NaN
            var text = ageText(seconds, now)
            line.textContent = text === '' ? '' : 'Reading from ' + text
          } catch (e) {}
        })
      }
      ageLines()
      setInterval(ageLines, 30000)

      // The host tabs: one tab per host, and one card shown at a time. Selecting a tab marks it aria-selected with
      // tabindex 0 (the others -1, a roving tabindex) and unhides its card. Nothing is stored: a reload selects the target.
      function tabsOf() { return document.querySelectorAll('button.host-tab') }
      function selectHost(name) {
        var tabs = tabsOf()
        var selected = null
        tabs.forEach(function (tab) {
          var on = tab.getAttribute('data-host') === name
          tab.setAttribute('aria-selected', on ? 'true' : 'false')
          tab.setAttribute('tabindex', on ? '0' : '-1')
          if (on) selected = tab
        })
        if (!selected) return null
        document.querySelectorAll('section.host').forEach(function (card) {
          if (card.getAttribute('data-host') === name) card.removeAttribute('hidden')
          else card.setAttribute('hidden', '')
        })
        return selected
      }
      // Left and Right move to the neighbouring tab and wrap at the ends; Home and End go to the first and the last.
      function tabAfter(key, tab) {
        var tabs = tabsOf()
        var at = -1
        tabs.forEach(function (other, i) { if (other === tab) at = i })
        var n = tabs.length
        if (at < 0 || n === 0) return null
        if (key === 'ArrowRight') return tabs[(at + 1) % n]
        if (key === 'ArrowLeft') return tabs[(at - 1 + n) % n]
        if (key === 'Home') return tabs[0]
        if (key === 'End') return tabs[n - 1]
        return null
      }
      function bindTabs(root) {
        root.querySelectorAll('button.host-tab').forEach(function (tab) {
          tab.addEventListener('click', function () { selectHost(tab.getAttribute('data-host')) })
          tab.addEventListener('keydown', function (event) {
            var next = tabAfter(event.key, tab)
            if (!next) return
            event.preventDefault()
            selectHost(next.getAttribute('data-host'))
            next.focus()
          })
        })
      }
      bindTabs(document)

      // The panel follows the focused workspace's host. While the page is visible, every FOCUS_POLL_MS (and on load and
      // when it becomes visible) the worker reports which host the focused workspace is on. A change of that host selects
      // its tab and scrolls the tab strip to it; the same host again does nothing, so a tab the user picked by hand stays
      // selected until the workspace changes. A fallback code or a timed-out call means the host cannot run the worker's commands: polling stops.
      var FOCUS_POLL_MS = 4000
      var focusHost = null
      var focusBusy = false
      var focusStopped = false
      function showFocusedHost(name) {
        var tab = selectHost(name)
        if (tab && tab.scrollIntoView) tab.scrollIntoView({ block: 'nearest', inline: 'nearest' })
      }
      function pollFocus() {
        if (focusStopped || focusBusy || document.visibilityState !== 'visible') return
        focusBusy = true
        runWorker('active-host', {}).then(function (result) {
          focusBusy = false
          if (!result.ok) {
            if (result.timedOut || FALLBACK_CODES.indexOf(result.errorCode) >= 0) focusStopped = true
            return
          }
          // A worker that cannot read the session answers ok false with no host; that is quiet, and the next poll tries again.
          var value = (result.value && result.value.value) || {}
          if (value.ok === false || typeof value.host !== 'string' || value.host === '' || value.host === focusHost) return
          focusHost = value.host
          showFocusedHost(value.host)
        })
      }
      pollFocus()
      setInterval(pollFocus, FOCUS_POLL_MS)
      document.addEventListener('visibilitychange', pollFocus)

      // Live numbers. In a development install every rewrite of this page reloads the whole plugin, so the worker
      // rewrites it only when more than numbers changed. Meanwhile, while the page is visible, it asks the worker for its
      // latest render every LIVE_POLL_MS and updates in place each text and attribute that differs from it only in its
      // digits: a percentage, a reset time, a bar width, a ring arc, a tooltip. A difference beyond digits (another
      // account, a state, a chip) waits for the rewrite, and what the page itself set (a face, a view, the selected tab)
      // is never touched. The clocks are redrawn from the new data. A host without plugin.request keeps the page as written.
      var LIVE_POLL_MS = 15000
      var liveBusy = false
      function digitsOnly(a, b) {
        return a !== b && a.replace(/\d+/g, '#') === b.replace(/\d+/g, '#')
      }
      function patchLive(oldNode, newNode) {
        if (oldNode.nodeType !== newNode.nodeType) return
        if (oldNode.nodeType === 3) {
          if (digitsOnly(oldNode.nodeValue, newNode.nodeValue)) oldNode.nodeValue = newNode.nodeValue
          return
        }
        if (oldNode.nodeType !== 1 || oldNode.tagName !== newNode.tagName) return
        for (var i = 0; i < newNode.attributes.length; i++) {
          var attr = newNode.attributes[i]
          var current = oldNode.getAttribute(attr.name)
          if (current !== null && digitsOnly(current, attr.value)) oldNode.setAttribute(attr.name, attr.value)
        }
        // The clocks and the reading ages are written by this script; only their attributes come from the render.
        if (oldNode.classList.contains('clock') || oldNode.matches('p.reading')) return
        if (oldNode.childNodes.length !== newNode.childNodes.length) return
        for (var j = 0; j < newNode.childNodes.length; j++) patchLive(oldNode.childNodes[j], newNode.childNodes[j])
      }
      // What the person selected on the page (tab, face, view), kept across a replaced <main>.
      function pageState() {
        var tab = document.querySelector('button.host-tab[aria-selected="true"]')
        var card = document.querySelector('section.host')
        return { tab: tab && tab.getAttribute('data-host'), face: card && card.getAttribute('data-face'), view: card && card.getAttribute('data-view') }
      }
      function restoreState(state) {
        document.querySelectorAll('section.host').forEach(function (card) {
          if (state.face) setFace(card, state.face)
          if (state.view) setView(card, state.view)
        })
        if (state.tab) selectHost(state.tab)
      }
      // A render whose structure changed (another account, a state, a chip) replaces <main> in place: no reload, and the
      // worker, which no longer writes the page, is not restarted. The structure key is the worker's digest of the
      // render with its digits taken out, so a change of numbers alone never replaces anything.
      function replaceMain(page, fresh) {
        var state = pageState()
        page.replaceChildren.apply(page, Array.prototype.map.call(fresh.childNodes, function (node) { return document.importNode(node, true) }))
        bindToggles(page)
        bindCommands(page)
        bindTabs(page)
        restoreState(state)
      }
      function pollLive() {
        if (liveBusy || !hostHasRequest() || document.visibilityState !== 'visible') return
        liveBusy = true
        call('plugin.request', { name: 'panel-live', input: {}, timeoutMs: 5000 }, 6000).then(function (result) {
          liveBusy = false
          var live = result.ok && result.value && result.value.output
          if (!live || typeof live.html !== 'string' || !live.data) return
          try {
            var fresh = new DOMParser().parseFromString(live.html, 'text/html').querySelector('main')
            var page = document.querySelector('main')
            if (!fresh || !page) return
            if (live.data.structureKey && live.data.structureKey !== data.structureKey) replaceMain(page, fresh)
            else patchLive(page, fresh)
            data = live.data
            ageLines()
            if (typeof window.grazrDraw === 'function') window.grazrDraw()
          } catch (e) {}
        })
      }
      pollLive()
      setInterval(pollLive, LIVE_POLL_MS)
      document.addEventListener('visibilitychange', pollLive)

      document.getElementById('stamp').textContent = 'Cmd-J Grazr: Refresh panel'

      // Once per load, and only for a stale page: the refresh rewrites the page, and a fresh page is never refreshed again.
      if (data.generatedAt && Date.now() - Date.parse(data.generatedAt) > STALE_MS) {
        runWorker('panel-refresh', {}).then(function (result) {
          // A failed or timed-out wake-up leaves the page stale; the footer says how to refresh it by hand.
          // A host that runs it neither way leaves the footer as it is, since an old generatedAt does not mean stale data.
          if (FALLBACK_CODES.indexOf(result.errorCode) >= 0) return
          var outcome = (result.value && result.value.value) || {}
          if (!result.ok || outcome.ok === false) {
            document.getElementById('stamp').textContent = 'Panel refresh failed — Cmd-J Grazr: Refresh panel'
          }
        })
      }
    </script>
    <script type="module">
      /*__CLOCK__*/

      // Each card's clock is projected here from the embedded data and the browser's own clock, at load and every 30 s.
      function draw() {
        document.querySelectorAll('section.host').forEach(function (card) {
          // One card's failure (malformed data) must not stop the other cards or the load.
          try {
            var name = card.getAttribute('data-host')
            var entry = data.hosts && data.hosts[name]
            var clock = entry && entry.clock
            if (!clock) return
            card.querySelectorAll('.clock').forEach(function (div) {
              div.innerHTML = clockSvg(clock, { now: Date.now() / 1000, span: div.getAttribute('data-span') })
            })
          } catch (e) {}
        })
      }
      draw()
      setInterval(draw, 30000)
      // The live update redraws the clocks from the data it brings.
      window.grazrDraw = draw
    </script>
  </body>
</html>
